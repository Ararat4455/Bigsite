<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Bigsite</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="error-page coming-soon-page">
    <header class="error-header">
        <a href="../../index.html" class="logo">
            <span class="logo-icon"><i class="fas fa-rocket"></i></span>
            <span class="logo-text">Bigsite</span>
        </a>
    </header>

    <main class="error-main">
        <div class="error-content">
            <div class="error-icon large">
                <i class="fas fa-hourglass-half"></i>
            </div>
            <h1>Coming Soon</h1>
            <p>We're working hard to bring you an amazing experience. Stay tuned!</p>
            <div class="countdown-timer" id="countdown">
                <div class="timer-item">
                    <span class="timer-value" id="days">00</span>
                    <span class="timer-label">Days</span>
                </div>
                <div class="timer-separator">:</div>
                <div class="timer-item">
                    <span class="timer-value" id="hours">00</span>
                    <span class="timer-label">Hours</span>
                </div>
                <div class="timer-separator">:</div>
                <div class="timer-item">
                    <span class="timer-value" id="minutes">00</span>
                    <span class="timer-label">Minutes</span>
                </div>
                <div class="timer-separator">:</div>
                <div class="timer-item">
                    <span class="timer-value" id="seconds">00</span>
                    <span class="timer-label">Seconds</span>
                </div>
            </div>
            <div class="newsletter-signup">
                <h3>Subscribe for Updates</h3>
                <p>Get notified when we launch</p>
                <form class="newsletter-form" onsubmit="subscribe(event)">
                    <input type="email" placeholder="Enter your email address" required>
                    <button type="submit"><i class="fas fa-paper-plane"></i></button>
                </form>
            </div>
            <div class="social-links">
                <a href="#" title="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </main>

    <footer class="error-footer">
        <div class="footer-content">
            <p>&copy; 2024 Bigsite. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function subscribe(e){e.preventDefault();alert('Thank you for subscribing! We\'ll notify you when we launch.');e.target.reset()}
        function updateCountdown(){const targetDate=new Date('Dec 31, 2024 23:59:59').getTime();const now=new Date().getTime();const distance=targetDate-now;if(distance<0){document.getElementById('days').textContent='00';document.getElementById('hours').textContent='00';document.getElementById('minutes').textContent='00';document.getElementById('seconds').textContent='00';return}const days=Math.floor(distance/(1000*60*60*24));const hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));const minutes=Math.floor((distance%(1000*60*60))/(1000*60));const seconds=Math.floor((distance%(1000*60))/1000);document.getElementById('days').textContent=days.toString().padStart(2,'0');document.getElementById('hours').textContent=hours.toString().padStart(2,'0');document.getElementById('minutes').textContent=minutes.toString().padStart(2,'0');document.getElementById('seconds').textContent=seconds.toString().padStart(2,'0')}
        updateCountdown();setInterval(updateCountdown,1000);
    </script>
</body>
</html>
