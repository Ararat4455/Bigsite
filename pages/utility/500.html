<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Bigsite</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="error-page">
    <header class="error-header">
        <a href="../../index.html" class="logo">
            <span class="logo-icon"><i class="fas fa-rocket"></i></span>
            <span class="logo-text">Bigsite</span>
        </a>
        <nav class="error-nav">
            <a href="../../index.html">Home</a>
            <a href="../../about.html">About</a>
            <a href="../../contact.html">Contact</a>
        </nav>
    </header>

    <main class="error-main">
        <div class="error-content">
            <div class="error-code">
                <span>5</span>
                <span class="error-icon"><i class="fas fa-server"></i></span>
                <span>0</span>
            </div>
            <h1>Server Error</h1>
            <p>Something went wrong on our end. We're working to fix it as soon as possible.</p>
            <div class="error-actions">
                <button class="btn btn-primary" onclick="goHome()">
                    <i class="fas fa-home"></i>
                    <span>Go Home</span>
                </button>
                <button class="btn btn-secondary" onclick="tryAgain()">
                    <i class="fas fa-sync"></i>
                    <span>Try Again</span>
                </button>
                <button class="btn btn-text" onclick="contactUs()">
                    <i class="fas fa-envelope"></i>
                    <span>Contact Us</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="error-footer">
        <div class="footer-content">
            <p>&copy; 2024 Bigsite. All rights reserved.</p>
            <div class="footer-links">
                <a href="../../about.html">About</a>
                <a href="../../contact.html">Contact</a>
                <a href="privacy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Service</a>
            </div>
        </div>
    </footer>

    <script>
        function goHome(){window.location.href='../../index.html'}
        function tryAgain(){window.location.reload()}
        function contactUs(){window.location.href='../../contact.html'}
    </script>
</body>
</html>
